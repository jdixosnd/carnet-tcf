# Builds the Windows installers (NSIS .exe + .msi) on a real Windows machine.
# Unsigned, no updater yet (sub-project 3). Download them from the run's "Artifacts".
name: Windows installer

on:
  push:
    branches: [main, ci/**]
  workflow_dispatch:

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npx vitest run

      - name: Build installers
        run: npx tauri build --bundles nsis,msi

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: carnet-tcf-windows
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
